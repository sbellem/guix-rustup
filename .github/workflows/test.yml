name: test
on: [push]
jobs:
  build-with-channels:
    name: Test as Guix channel
    runs-on: ubuntu-latest
    strategy:
      # building independent packages, don’t abort entire build if one fails
      fail-fast: false
    steps:
      - name: Guix cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/guix
          # use a key that (almost) never matches
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-
      # Cannot use a cache for /gnu/store, since restore fails
      - name: Install Guix
        id: install-guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          channels: |-
            (list (channel
                   (inherit %default-guix-channel))
                  (channel
                   (name 'rustup)
                   (url "https://github.com/sbellem/guix-rustup")
                   (branch "dev")
                   (introduction
                    (make-channel-introduction
                     "d9bcf7f979506b880a5ba25674a606a824d9c890"
                     (openpgp-fingerprint
                      "E39D 2B3D 0564 BA43 7BD9  2756 C38A E0EC CAB7 D5C8")))))
      - name: Build
        run: guix build rust-bin
      - name: Build
        run: guix build -e '((@@ (rustup build toolchain) rustup) "stable")'
      - name: Build
        run: guix build -e '((@@ (rustup build toolchain) rustup) "nightly")'

  build-local:
    name: Test local checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guix cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/guix
          key: guix-cache-local-${{ github.sha }}
          restore-keys: |
            guix-cache-local-
      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          channels: |-
            (list (channel
                   (inherit %default-guix-channel))
                  (channel
                   (name 'nonguix)
                   (url "https://gitlab.com/nonguix/nonguix")
                   (introduction
                    (make-channel-introduction
                     "897c1a470da759236cc11798f4e0a5f7d4d59fbc"
                     (openpgp-fingerprint
                      "2A39 3FFF 68F4 EF7A 3D29  12AF 6F51 20A0 22FB B2D5")))))
      - name: Build rust-bin
        run: guix build --load-path ./guix rust-bin
      - name: Build stable
        run: guix build --load-path ./guix -e '((@@ (rustup build toolchain) rustup) "stable")'
      - name: Build nightly
        run: guix build --load-path ./guix -e '((@@ (rustup build toolchain) rustup) "nightly")'
